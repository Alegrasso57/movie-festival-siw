<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Elenco Sale</title>
</head>
<body>
    <nav class="main-nav">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/festivals}">Festival</a>
        <a th:href="@{/movies}">Film</a>
        <a th:href="@{/screenings}">Proiezioni</a>
        <a th:href="@{/registi}">Registi</a>
        <a th:href="@{/sale}">Sale</a>
        <a th:href="@{/generi}">Generi</a>
    </nav>

    <div class="container pagina-centrata">
        <h1>Sale</h1>

        <form class="nav-search" th:action="@{/sale}" method="get">
            <input type="search" name="nome" placeholder="Cerca per nome sala..." th:value="${nome}">
            <button type="submit" aria-label="Cerca">&#128269;</button>
        </form>

        <div class="grid">
        <div class="card" th:each="sala : ${sale}">
            <h2 th:text="${sala.nome} + ' (' + ${sala.capienza} + ' posti)'">Nome (capienza)</h2>
            <ul class="card-details">
                <li><span th:text="'Situata in ' + ${sala.indirizzo}">Indirizzo</span></li>
            </ul>
        </div>
        </div>

        <p><a th:href="@{/}">Torna alla home</a></p>
    </div>
</body>
</html>
