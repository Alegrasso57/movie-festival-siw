<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Elenco Registi</title>
</head>
<body>
    <nav class="main-nav">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/festivals}">Festival</a>
        <a th:href="@{/movies}">Film</a>
        <a th:href="@{/screenings}">Proiezioni</a>
        <a th:href="@{/registi}">Registi</a>
        <a th:href="@{/sale}">Sale</a>
    </nav>

    <div class="container pagina-centrata">
        <h1>Registi</h1>

        <form class="nav-search" th:action="@{/registi}" method="get">
            <input type="search" name="cognome" placeholder="Cerca per cognome..." th:value="${cognome}">
            <button type="submit" aria-label="Cerca">&#128269;</button>
        </form>

        <div class="grid">
        <div class="card" th:each="regista : ${registi}">
            <h2 th:text="${regista.nome} + ' ' + ${regista.cognome}">Nome Cognome</h2>
            <ul class="card-details">
                <li><span th:text="'Data di nascita: ' + ${#temporals.format(regista.dataNascita, 'dd/MM/yyyy')}">Data di nascita</span></li>
                <li><span th:text="'Nazionalità: ' + ${regista.nazionalita}">Nazionalità</span></li>
            </ul>
        </div>
        </div>

        <p><a th:href="@{/}">Torna alla home</a></p>
    </div>
</body>
</html>
