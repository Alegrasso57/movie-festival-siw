<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Form Film</title>
</head>
<body>
<div class="container">
    <h1>Film</h1>

    <p class="errore" th:if="${erroreValidazione}">
        Controlla i campi obbligatori: tutti i valori devono essere validi.
    </p>

    <form th:action="@{/admin/film}" method="post">
        <input type="hidden" name="id" th:value="${film.id}">
        <label>Titolo: <input type="text" name="titolo" th:value="${film.titolo}"></label>
        <label>Anno: <input type="number" name="anno" th:value="${film.anno}"></label>
        <label>Durata (minuti): <input type="number" name="durata" th:value="${film.durata}"></label>
        <label>Genere: <input type="text" name="genere" th:value="${film.genere}"></label>
        <label>Paese di produzione: <input type="text" name="paeseProduzione" th:value="${film.paeseProduzione}"></label>

        <label>Regista:
            <select name="registaId">
                <option th:each="regista : ${registi}"
                        th:value="${regista.id}"
                        th:text="${regista.nome} + ' ' + ${regista.cognome}"
                        th:selected="${film.regista != null and film.regista.id == regista.id}">
                    Nome Cognome
                </option>
            </select>
        </label>

        <button type="submit">Salva</button>
    </form>

    <p><a th:href="@{/admin/film}">Annulla</a></p>
</div>
</body>
</html>
