<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Form Sala</title>
</head>
<body>
    <nav class="main-nav">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/festivals}">Festival</a>
        <a th:href="@{/movies}">Film</a>
        <a th:href="@{/screenings}">Proiezioni</a>
        <a th:href="@{/registi}">Registi</a>
        <a th:href="@{/sale}">Sale</a>
        <a th:href="@{/generi}">Generi</a>
    </nav>
<div class="container pagina-centrata">
    <h1>Sala</h1>

    <p class="errore" th:if="${erroreValidazione}">
        Controlla i campi obbligatori: tutti i valori devono essere validi.
    </p>

    <form th:action="@{/admin/sale}" method="post">
        <input type="hidden" name="id" th:value="${sala.id}">
        <label>Nome: <input type="text" name="nome" th:value="${sala.nome}"></label>
        <label>Indirizzo: <input type="text" name="indirizzo" th:value="${sala.indirizzo}"></label>
        <label>Capienza: <input type="number" name="capienza" th:value="${sala.capienza}"></label>
        <div class="form-actions">
            <button type="submit">Salva</button>
            <a th:href="@{/admin/sale}" class="btn-annulla">Annulla</a>
        </div>
    </form>
</div>
</body>
</html>
