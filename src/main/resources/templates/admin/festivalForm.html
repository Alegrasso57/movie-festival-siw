<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Form Festival</title>
</head>
<body>
    <nav class="main-nav">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/festivals}">Festival</a>
        <a th:href="@{/movies}">Film</a>
        <a th:href="@{/screenings}">Proiezioni</a>
        <a th:href="@{/registi}">Registi</a>
        <a th:href="@{/sale}">Sale</a>
        <a th:href="@{/generi}">Generi</a>
    </nav>
<div class="container pagina-centrata">
    <h1>Festival</h1>

    <p class="errore" th:if="${erroreValidazione}">
        Controlla i campi obbligatori: tutti i valori devono essere validi.
    </p>

    <form th:action="@{/admin/festival}" method="post">
        <input type="hidden" name="id" th:value="${festival.id}">
        <label>Nome: <input type="text" name="nome" th:value="${festival.nome}"></label>
        <label>Anno: <input type="number" name="anno" th:value="${festival.anno}"></label>
        <label>Città: <input type="text" name="citta" th:value="${festival.citta}"></label>
        <label>Data inizio: <input type="date" name="dataInizio" th:value="${festival.dataInizio}"></label>
        <label>Data fine: <input type="date" name="dataFine" th:value="${festival.dataFine}"></label>
        <label>Descrizione: <textarea name="descrizione" th:text="${festival.descrizione}"></textarea></label>

        <label>Film partecipanti:</label>
        <div class="checkbox-list">
            <label class="checkbox-item" th:each="film : ${filmDisponibili}">
                <input type="checkbox" name="filmIds" th:value="${film.id}"
                       th:checked="${festival.film != null and festival.film.contains(film)}">
                <span th:text="${film.titolo}">Titolo film</span>
            </label>
        </div>

        <div class="form-actions">
            <button type="submit">Salva</button>
            <a th:href="@{/admin/festival}" class="btn-annulla">Annulla</a>
        </div>
    </form>
</div>
</body>
</html>
