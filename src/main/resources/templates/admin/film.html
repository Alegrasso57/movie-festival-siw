<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Gestione Film</title>
</head>
<body>
    <nav class="main-nav">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/festivals}">Festival</a>
        <a th:href="@{/movies}">Film</a>
        <a th:href="@{/screenings}">Proiezioni</a>
        <form class="nav-search" th:action="@{/app}" method="get">
            <input type="search" name="q" placeholder="Cerca film, proiezioni...">
            <button type="submit" aria-label="Cerca">&#128269;</button>
        </form>
    </nav>
<div class="container pagina-centrata">
    <h1>Gestione Film</h1>

    <a th:href="@{/admin/film/nuovo}">+ Nuovo film</a>

    <div class="grid">
    <div class="card" th:each="film : ${filmList}">
        <h2 th:text="${film.titolo}">Titolo</h2>
        <ul class="card-details">
            <li><span th:text="${film.anno}">Anno</span></li>
        </ul>
        <div class="actions">
            <a th:href="@{/admin/film/{id}/modifica(id=${film.id})}">Modifica</a>
            <form th:action="@{/admin/film/{id}/elimina(id=${film.id})}" method="post">
                <button type="submit">Elimina</button>
            </form>
        </div>
    </div>
    </div>

    <p><a th:href="@{/}">Torna alla home</a></p>
</div>
</body>
</html>
