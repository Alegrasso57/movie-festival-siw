<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Gestione Film</title>
</head>
<body>
    <h1>Gestione Film</h1>

    <a th:href="@{/admin/film/nuovo}">+ Nuovo film</a>

    <ul>
        <li th:each="film : ${filmList}">
            <span th:text="${film.titolo} + ' (' + ${film.anno} + ')'">Titolo (Anno)</span>
            <a th:href="@{/admin/film/{id}/modifica(id=${film.id})}">Modifica</a>
            <form th:action="@{/admin/film/{id}/elimina(id=${film.id})}" method="post" style="display:inline;">
                <button type="submit">Elimina</button>
            </form>
        </li>
    </ul>

    <p><a th:href="@{/}">Torna alla home</a></p>
</body>
</html>
