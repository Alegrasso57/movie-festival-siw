<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Gestione Proiezioni</title>
</head>
<body>
    <nav class="main-nav">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/festivals}">Festival</a>
        <a th:href="@{/movies}">Film</a>
        <a th:href="@{/screenings}">Proiezioni</a>
        <a th:href="@{/registi}">Registi</a>
        <a th:href="@{/sale}">Sale</a>
        <a th:href="@{/generi}">Generi</a>
    </nav>
<div class="container pagina-centrata">
    <h1>Gestione Proiezioni</h1>

    <a th:href="@{/admin/proiezioni/nuova}">+ Nuova proiezione</a>

    
    <div class="grid">
    <div class="card" th:each="proiezione : ${proiezioniList}">
        <ul class="card-details">
            <li><span th:text="${proiezione.film.titolo}">Film</span></li>
            <li><span th:text="${proiezione.festival.nome}">Festival</span></li>
            <li><span th:text="${#temporals.format(proiezione.data, 'dd/MM/yyyy')}">Data</span></li>
            <li><span th:text="'Ore ' + ${proiezione.ora}">Ora</span></li>
            <li><span th:text="${proiezione.sala.nome}">Sala</span></li>
            <li><span th:text="${proiezione.stato}">Stato</span></li>
        </ul>
        <div class="actions">
            <a th:href="@{/admin/proiezioni/{id}/modifica(id=${proiezione.id})}">Modifica</a>
            <form th:if="${proiezione.stato.name() == 'SCHEDULED'}"
                  th:action="@{/admin/proiezioni/{id}/completa(id=${proiezione.id})}" method="post">
                <button type="submit">Segna come completata</button>
            </form>
            <form th:action="@{/admin/proiezioni/{id}/elimina(id=${proiezione.id})}" method="post">
                <button type="submit">Elimina</button>
            </form>
        </div>
    </div>
    </div>

    <p><a th:href="@{/}">Torna alla home</a></p>
</div>
</body>
</html>
