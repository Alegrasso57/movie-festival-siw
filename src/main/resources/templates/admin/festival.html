<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Gestione Festival</title>
</head>
<body>
    <nav class="main-nav">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/festivals}">Festival</a>
        <a th:href="@{/movies}">Film</a>
        <a th:href="@{/screenings}">Proiezioni</a>
        <a th:href="@{/registi}">Registi</a>
        <a th:href="@{/sale}">Sale</a>
        <a th:href="@{/generi}">Generi</a>
    </nav>
<div class="container pagina-centrata">
    <h1>Gestione Festival</h1>

    <a th:href="@{/admin/festival/nuovo}">+ Nuovo festival</a>

    <div class="grid">
    <div class="card" th:each="festival : ${festivalList}">
        <h2 th:text="${festival.nome}">Nome Festival</h2>
        <ul class="card-details">
            <li><span th:text="'da ' + ${#temporals.format(festival.dataInizio, 'dd/MM/yyyy')} + ' a ' + ${#temporals.format(festival.dataFine, 'dd/MM/yyyy')}">Periodo</span></li>
        </ul>
        <div class="actions">
            <a th:href="@{/admin/festival/{id}/modifica(id=${festival.id})}">Modifica</a>
            <form th:action="@{/admin/festival/{id}/elimina(id=${festival.id})}" method="post">
                <button type="submit">Elimina</button>
            </form>
        </div>
    </div>
    </div>

    <p><a th:href="@{/}">Torna alla home</a></p>
</div>
</body>
</html>
