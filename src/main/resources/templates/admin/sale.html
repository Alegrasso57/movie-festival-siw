<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Gestione Sale</title>
</head>
<body>
<div class="container">
    <h1>Gestione Sale</h1>

    <a th:href="@{/admin/sale/nuova}">+ Nuova sala</a>

    <div class="card" th:each="sala : ${sale}">
        <span th:text="${sala.nome} + ' (' + ${sala.capienza} + ' posti)'">Nome (capienza)</span>
        <div class="actions">
            <a th:href="@{/admin/sale/{id}/modifica(id=${sala.id})}">Modifica</a>
            <form th:action="@{/admin/sale/{id}/elimina(id=${sala.id})}" method="post">
                <button type="submit">Elimina</button>
            </form>
        </div>
    </div>

    <p><a th:href="@{/}">Torna alla home</a></p>
</div>
</body>
</html>
