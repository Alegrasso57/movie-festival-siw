<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Gestione Sale</title>
</head>
<body>
    <nav class="main-nav">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/festivals}">Festival</a>
        <a th:href="@{/movies}">Film</a>
        <a th:href="@{/screenings}">Proiezioni</a>
        <a th:href="@{/registi}">Registi</a>
        <a th:href="@{/sale}">Sale</a>
    </nav>
<div class="container pagina-centrata">
    <h1>Gestione Sale</h1>

    <p class="errore" th:if="${erroreEliminazione}" th:text="${erroreEliminazione}"></p>

    <a th:href="@{/admin/sale/nuova}">+ Nuova sala</a>

    <div class="grid">
    <div class="card" th:each="sala : ${sale}">
        <h2 th:text="${sala.nome} + ' (' + ${sala.capienza} + ' posti)'">Nome (capienza)</h2>
        <ul class="card-details">
            <li><span th:text="'Situata in ' + ${sala.indirizzo}">Indirizzo</span></li>
        </ul>
        <div class="actions">
            <a th:href="@{/admin/sale/{id}/modifica(id=${sala.id})}">Modifica</a>
            <form th:action="@{/admin/sale/{id}/elimina(id=${sala.id})}" method="post">
                <button type="submit">Elimina</button>
            </form>
        </div>
    </div>
    </div>

    <p><a th:href="@{/}">Torna alla home</a></p>
</div>
</body>
</html>
