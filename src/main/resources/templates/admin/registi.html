<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Gestione Registi</title>
</head>
<body>
    <nav class="main-nav">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/festivals}">Festival</a>
        <a th:href="@{/movies}">Film</a>
        <a th:href="@{/screenings}">Proiezioni</a>
        <form class="nav-search" th:action="@{/app}" method="get">
            <input type="search" name="q" placeholder="Cerca film, proiezioni...">
            <button type="submit" aria-label="Cerca">&#128269;</button>
        </form>
    </nav>
<div class="container pagina-centrata">
    <h1>Gestione Registi</h1>

    <p class="errore" th:if="${erroreEliminazione}" th:text="${erroreEliminazione}"></p>

    <a th:href="@{/admin/registi/nuovo}">+ Nuovo regista</a>

    <div class="grid">
    <div class="card" th:each="regista : ${registi}">
        <h2 th:text="${regista.nome} + ' ' + ${regista.cognome}">Nome Cognome</h2>
        <ul class="card-details">
            <li><span th:text="'Data di nascita: ' + ${#temporals.format(regista.dataNascita, 'dd/MM/yyyy')}">Data di nascita</span></li>
            <li><span th:text="'Nazionalità: ' + ${regista.nazionalita}">Nazionalità</span></li>
        </ul>
        <div class="actions">
            <a th:href="@{/admin/registi/{id}/modifica(id=${regista.id})}">Modifica</a>
            <form th:action="@{/admin/registi/{id}/elimina(id=${regista.id})}" method="post">
                <button type="submit">Elimina</button>
            </form>
        </div>
    </div>
    </div>

    <p><a th:href="@{/}">Torna alla home</a></p>
</div>
</body>
</html>
