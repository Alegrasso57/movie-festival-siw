<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Elenco Festival</title>
</head>
<body>
    <nav class="main-nav">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/festivals}">Festival</a>
        <a th:href="@{/movies}">Film</a>
        <a th:href="@{/screenings}">Proiezioni</a>
        <a th:href="@{/registi}">Registi</a>
        <a th:href="@{/sale}">Sale</a>
        <a th:href="@{/generi}">Generi</a>
    </nav>

    <div class="container pagina-centrata">
        <h1>Festival cinematografici</h1>

        <form class="nav-search" th:action="@{/festivals}" method="get">
            <input type="search" name="nome" placeholder="Cerca per nome festival..." th:value="${nome}">
            <button type="submit" aria-label="Cerca">&#128269;</button>
        </form>

        <div class="grid">
        <div class="card" th:each="festival : ${festivals}">
            <h2>
                <a th:href="@{/festival/{id}(id=${festival.id})}" th:text="${festival.nome}">Nome Festival</a>
            </h2>
            <ul class="card-details">
                <li><span th:text="${festival.citta} + ', ' + ${festival.anno}">Città, Anno</span></li>
                <li><span th:text="'da ' + ${#temporals.format(festival.dataInizio, 'dd/MM/yyyy')} + ' a ' + ${#temporals.format(festival.dataFine, 'dd/MM/yyyy')}">Periodo</span></li>
            </ul>
            
        </div>
        </div>

        <p><a th:href="@{/}">Torna alla home</a></p>
        
    </div>
</body>
</html>
