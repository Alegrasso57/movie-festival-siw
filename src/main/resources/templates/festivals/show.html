<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title th:text="${festival.nome}">Dettaglio Festival</title>
</head>
<body>
    <nav class="main-nav">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/festivals}">Festival</a>
        <a th:href="@{/movies}">Film</a>
        <a th:href="@{/screenings}">Proiezioni</a>
            <form class="nav-search" th:action="@{/app}" method="get">
            <input type="search" name="q" placeholder="Cerca film, proiezioni...">
            <button type="submit" aria-label="Cerca">&#128269;</button>
        </form>
    </nav>

    <div class="container pagina-centrata">
        <h1 th:text="${festival.nome}">Nome Festival</h1>

        <div class="dettaglio-info">
            <p>Città: <span th:text="${festival.citta}">Città</span></p>
            <p>Anno: <span th:text="${festival.anno}">Anno</span></p>
            <p>Dal <span th:text="${#temporals.format(festival.dataInizio, 'dd/MM/yyyy')}">Data inizio</span> al <span th:text="${#temporals.format(festival.dataFine, 'dd/MM/yyyy')}">Data fine</span></p>
            <p class="descrizione" th:text="${festival.descrizione}">Descrizione</p>
        </div>

        <h2>Film partecipanti</h2>
        <div class="grid">
        <div class="card" th:each="film : ${festival.film}">
            <a th:href="@{/movie/{id}(id=${film.id})}" th:text="${film.titolo}">Titolo film</a>
        </div>
        </div>

        <h2>Proiezioni</h2>
        <div class="grid">
        <div class="card" th:each="proiezione : ${festival.proiezioni}">
            <h2>
                <a th:href="@{/movie/{id}(id=${proiezione.film.id})}" th:text="${proiezione.film.titolo}">Film</a>
            </h2>
            <ul class="card-details">
                <li><span th:text="${#temporals.format(proiezione.data, 'dd/MM/yyyy')} + ' ore ' + ${proiezione.ora}">Data e ora</span></li>
                <li><span th:text="${proiezione.sala.nome}">Sala</span></li>
                <li><span th:text="${proiezione.stato}">Stato</span></li>
            </ul>
        </div>
        </div>

        <p><a th:href="@{/festivals}">Torna all'elenco</a></p>
    </div>
</body>
</html>
