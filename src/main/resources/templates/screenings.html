<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Programma Proiezioni</title>
</head>
<body>
    <nav class="main-nav">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/festivals}">Festival</a>
        <a th:href="@{/movies}">Film</a>
        <a th:href="@{/screenings}">Proiezioni</a>
        <a th:href="@{/registi}">Registi</a>
        <a th:href="@{/sale}">Sale</a>
    </nav>

    <div class="container pagina-centrata">
        <h1>Programma delle proiezioni</h1>

        <form class="nav-search" th:action="@{/screenings}" method="get">
            <input type="search" name="film" placeholder="Cerca per titolo del film..." th:value="${film}">
            <button type="submit" aria-label="Cerca">&#128269;</button>
        </form>

        <div class="grid">
        <div class="card" th:each="proiezione : ${proiezioni}">
            <h2>
                <a th:href="@{/movie/{id}(id=${proiezione.film.id})}" th:text="${proiezione.film.titolo}">Film</a>
            </h2>
            <ul class="card-details">
                <li><span th:text="${#temporals.format(proiezione.data, 'dd/MM/yyyy')} + ' ore ' + ${proiezione.ora}">Data e ora</span></li>
                <li><span th:text="${proiezione.sala.nome} + ' (' + ${proiezione.sala.indirizzo} + ', ' + ${proiezione.sala.capienza} + ' posti)'">Sala (indirizzo, capienza)</span></li>
                <li><span th:text="${proiezione.stato}">Stato</span></li>
                <li><a th:href="@{/festival/{id}(id=${proiezione.festival.id})}" th:text="${proiezione.festival.nome}">Festival</a></li>
            </ul>
        </div>
        </div>

        <p><a th:href="@{/}">Torna alla home</a></p>
    </div>
</body>
</html>
