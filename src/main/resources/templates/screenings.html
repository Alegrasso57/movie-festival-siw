<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Programma Proiezioni</title>
</head>
<body>
    <nav class="main-nav">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/festivals}">Festival</a>
        <a th:href="@{/movies}">Film</a>
        <a th:href="@{/screenings}">Proiezioni</a>
    </nav>

    <div class="container">
        <h1>Programma delle proiezioni</h1>

        <div class="card" th:each="proiezione : ${proiezioni}">
            <a th:href="@{/movie/{id}(id=${proiezione.film.id})}" th:text="${proiezione.film.titolo}">Film</a>
            —
            <span th:text="${proiezione.data} + ' ore ' + ${proiezione.ora}">Data e ora</span>
            —
            <span th:text="${proiezione.sala.nome}">Sala</span>
            —
            <span th:text="${proiezione.stato}">Stato</span>
            —
            <a th:href="@{/festival/{id}(id=${proiezione.festival.id})}" th:text="${proiezione.festival.nome}">Festival</a>
        </div>

        <p><a th:href="@{/}">Torna alla home</a></p>
    </div>
</body>
</html>
