<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Modifica Recensione</title>
</head>
<body>
    <nav class="main-nav">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/festivals}">Festival</a>
        <a th:href="@{/movies}">Film</a>
        <a th:href="@{/screenings}">Proiezioni</a>
    </nav>

    <div class="container">
        <h1>Modifica la tua recensione</h1>

        <form th:action="@{/recensione/{id}/modifica(id=${recensione.id})}" method="post">
            <label>Voto (1-10):
                <input type="number" name="voto" min="1" max="10" th:value="${recensione.voto}">
            </label>
            <label>Testo:
                <textarea name="testo" th:text="${recensione.testo}"></textarea>
            </label>
            <button type="submit">Salva modifiche</button>
        </form>

        <p><a th:href="@{/movie/{id}(id=${recensione.film.id})}">Annulla</a></p>
    </div>
</body>
</html>
